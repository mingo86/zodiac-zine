<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zodiac — Facts About (animata)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --ink:#15110d; --paper:#fff6e3; --red:#ec2e36;
  --yellow:#ffd23f; --blue:#37a8e6; --green:#36b06a;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:#241a3e;min-height:100vh;display:flex;flex-direction:column;
  align-items:center;gap:14px;padding:22px 10px 50px;font-family:'Baloo 2',system-ui,sans-serif}
.hint{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;color:#9c8fc8;text-align:center;max-width:560px}
.controls{display:flex;gap:8px}
.controls button{font-family:'Space Mono',monospace;font-size:12px;color:#241a3e;background:#ffd23f;
  border:2px solid #15110d;border-radius:8px;padding:5px 12px;cursor:pointer;box-shadow:2px 2px 0 #15110d}

/* ---- CARD ---- */
.card{position:relative;width:min(560px,95vw);aspect-ratio:1/1;border-radius:20px;overflow:hidden;
  background:var(--paper);border:6px solid var(--ink);box-shadow:0 14px 0 rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,.05) 1.5px,transparent 1.7px);background-size:22px 22px}

/* ---- HEAD: serie + nome segno (Bangers) ---- */
.head{position:absolute;top:1.2%;left:0;right:0;text-align:center;z-index:6;
  opacity:0;transform:translateY(-14px) scale(.92);transition:opacity .45s ease,transform .5s cubic-bezier(.34,1.56,.64,1)}
.head.in{opacity:1;transform:translateY(0) scale(1)}
.series{font-family:'Baloo 2';font-weight:700;font-style:italic;line-height:1;margin-bottom:-4px;
  font-size:clamp(15px,3.6vw,22px);color:#6b6356;letter-spacing:.3px}
.signname{font-family:'Bangers',cursive;font-size:clamp(48px,12.4vw,86px);line-height:.9;letter-spacing:2px;
  color:var(--red);-webkit-text-stroke:2.5px var(--ink);text-shadow:5px 5px 0 var(--ink)}

/* ---- MASCOTTE: grande, centrata, mai coperta ---- */
#mascotWrap{position:absolute;left:50%;top:29%;width:29%;z-index:3;
  transform:translateX(-50%) scale(.55);opacity:0;
  transition:opacity .55s ease,transform .6s cubic-bezier(.34,1.7,.5,1)}
#mascotWrap.in{opacity:1;transform:translateX(-50%) scale(1)}
#mascot{animation:none}
#mascot.bob{animation:bob 3.2s ease-in-out infinite}
#mascot svg{display:block;width:100%;height:auto;filter:drop-shadow(0 7px 7px rgba(0,0,0,.28))}
#mascot .zpup{transition:transform .55s cubic-bezier(.4,1.3,.5,1)}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4%)}}

/* ---- BOX frasi: in ANELLO attorno alla mascotte, colori ALTERNATI ---- */
.box{position:absolute;z-index:4;
  font-family:'Baloo 2';font-weight:700;font-size:clamp(11px,2.45vw,15.5px);line-height:1.12;color:var(--ink);
  border:3.5px solid var(--ink);border-radius:13px;padding:7px 11px;box-shadow:4px 4px 0 var(--ink);
  opacity:0;transform:scale(.4);
  transition:opacity .4s ease,transform .5s cubic-bezier(.34,1.7,.5,1),box-shadow .42s ease,filter .42s ease;
  filter:saturate(.82) brightness(.97)}
.box.L{text-align:right}
.box.R{text-align:left}
.box.C{left:50%;text-align:center;transform:translateX(-50%) scale(.4)}
.box.y{background:var(--yellow)}
.box.b{background:var(--blue)}
.box.in{opacity:1;transform:scale(1)}
.box.C.in{opacity:1;transform:translateX(-50%) scale(1)}
.box.hot{transform:scale(1.12);box-shadow:7px 7px 0 var(--ink);filter:none;z-index:5}
.box.C.hot{transform:translateX(-50%) scale(1.12)}

/* ---- MANTRA: tag rosso INCLINATO (stile sito) + box crema + corsivo + typing ---- */
.mantra{position:absolute;left:5%;right:5%;bottom:3.4%;z-index:6;display:flex;align-items:center;gap:12px;
  background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:10px 14px;box-shadow:5px 5px 0 var(--ink);
  opacity:0;transform:scale(.85);transition:opacity .4s ease,transform .45s cubic-bezier(.34,1.56,.64,1)}
.mantra.in{opacity:1;transform:scale(1)}
.mantra .tag{font-family:'Bangers',cursive;letter-spacing:.03em;text-transform:uppercase;
  font-size:clamp(15px,3.2vw,19px);color:#fff;background:var(--red);
  border:2px solid var(--ink);border-radius:9px;padding:4px 14px;box-shadow:2px 2px 0 var(--ink);
  transform:rotate(-1.5deg);white-space:nowrap}
.mantra .mt{font-family:'Baloo 2';font-weight:700;font-style:italic;font-size:clamp(12px,2.95vw,17px);color:var(--ink);min-height:1.1em}
.mantra .mt.typing{border-right:2px solid var(--ink);animation:caret .75s step-end infinite}
@keyframes caret{50%{border-color:transparent}}
</style>
</head>
<body>
<div class="hint">▶ ANIMATA · ingresso coreografato → poi loop sguardo · registra lo schermo per il Reel</div>
<div class="controls"><button id="replay">↻ replay intro</button></div>

<div class="card" id="card">
  <div class="head" id="head">
    <div class="series">facts about…</div>
    <div class="signname" id="signname">LEONE</div>
  </div>
