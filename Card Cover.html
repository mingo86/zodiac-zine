<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Zodiac — Cover feed (1:1)</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bangers&family=Baloo+2:wght@500;600;700;800&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#15110d;--paper:#fff6e3;--red:#ec2e36;--yellow:#ffd23f;--blue:#37a8e6}
*{box-sizing:border-box}html,body{margin:0;padding:0}
body{background:#241a3e;min-height:100vh;display:flex;flex-direction:column;align-items:center;gap:12px;
  padding:22px 10px 50px;font-family:'Baloo 2',system-ui,sans-serif}
.hint{font-family:'Space Mono',monospace;font-size:12px;letter-spacing:1px;color:#9c8fc8;text-align:center;max-width:560px}
.controls button{font-family:'Space Mono',monospace;font-size:12px;color:#241a3e;background:#ffd23f;
  border:2px solid #15110d;border-radius:8px;padding:5px 12px;cursor:pointer;box-shadow:2px 2px 0 #15110d}

.card{position:relative;width:min(540px,95vw);aspect-ratio:1/1;border-radius:20px;overflow:hidden;
  background:var(--paper);border:6px solid var(--ink);box-shadow:0 14px 0 rgba(0,0,0,.45)}
.card::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:radial-gradient(circle,rgba(0,0,0,.05) 1.5px,transparent 1.7px);background-size:22px 22px}

.head{position:absolute;top:4%;left:0;right:0;text-align:center;z-index:6}
.series{font-family:'Baloo 2';font-weight:700;font-style:italic;line-height:1;margin-bottom:-3px;
  font-size:clamp(15px,3.6vw,22px);color:#6b6356}
.signname{font-family:'Bangers',cursive;font-size:clamp(58px,15vw,104px);line-height:.9;letter-spacing:2px;
  color:var(--red);-webkit-text-stroke:3px var(--ink);text-shadow:6px 6px 0 var(--ink)}

#mascotWrap{position:absolute;left:50%;top:36%;width:34%;transform:translateX(-50%);z-index:3;animation:bob 3.4s ease-in-out infinite}
#mascotWrap svg{display:block;width:100%;height:auto;filter:drop-shadow(0 8px 8px rgba(0,0,0,.28))}
@keyframes bob{0%,100%{transform:translateX(-50%) translateY(0)}50%{transform:translateX(-50%) translateY(-2.4%)}}

/* vignette spinte ai bordi: la griglia 4:5 ne taglia un pezzo -> invoglia ad aprire */
.box{position:absolute;z-index:4;font-family:'Baloo 2';font-weight:700;font-size:clamp(11px,2.5vw,16px);
  line-height:1.12;color:var(--ink);border:3.5px solid var(--ink);border-radius:13px;padding:7px 11px;
  box-shadow:4px 4px 0 var(--ink);filter:saturate(.82) brightness(.97)}
.box.L{text-align:right}.box.R{text-align:left}
.box.y{background:var(--yellow)}.box.b{background:var(--blue)}

.mantra{position:absolute;left:5%;right:5%;bottom:4%;z-index:6;display:flex;align-items:center;gap:12px;
  background:var(--paper);border:4px solid var(--ink);border-radius:14px;padding:9px 13px;box-shadow:5px 5px 0 var(--ink)}
.mantra .tag{font-family:'Bangers',cursive;letter-spacing:.03em;text-transform:uppercase;font-size:clamp(15px,3.2vw,19px);
  color:#fff;background:var(--red);border:2px solid var(--ink);border-radius:9px;padding:4px 14px;
  box-shadow:2px 2px 0 var(--ink);transform:rotate(-1.5deg);white-space:nowrap}
.mantra .mt{font-family:'Baloo 2';font-weight:700;font-style:italic;font-size:clamp(12px,2.95vw,17px);color:var(--ink)}

/* overlay: cosa mostra la griglia 4:5 del profilo (taglia ~10% per lato) */
.crop{position:absolute;inset:0;z-index:9;pointer-events:none;display:none}
.crop.on{display:block}
.crop .mask{position:absolute;top:0;bottom:0;width:10%;background:rgba(36,26,62,.55)}
.crop .mask.l{left:0;border-right:2px dashed #fff}
.crop .mask.r{right:0;border-left:2px dashed #fff}
.crop .lab{position:absolute;top:8px;left:50%;transform:translateX(-50%);font-family:'Space Mono',monospace;
  font-size:11px;color:#fff;background:#241a3e;border:1px solid #fff;border-radius:6px;padding:2px 8px}
</style>
</head>
<body>
<div class="hint">COVER FEED 1:1 · la griglia 4:5 del profilo taglia i lati → le vignette sbordano e invogliano ad aprire</div>
<div class="controls"><button id="toggle">mostra/nascondi taglio 4:5</button></div>

<div class="card" id="card">
  <div class="head">
    <div class="series">facts about…</div>
    <div class="signname">LEONE</div>
  </div>
  <div id="mascotWrap"></div>
  <div class="mantra"><span class="tag">MANTRA</span><span class="mt">«Nata per stare al centro della scena.»</span></div>
  <div class="crop" id="crop">
    <div class="mask l"></div><div class="mask r"></div>
    <div class="lab">↑ ciò che si vede nel feed (4:5) ↑</div>
  </div>
</div>

<script src="coppie/mascots.js"></script>
<script>
(function(){
  var card=document.getElementById('card');
  document.getElementById('mascotWrap').innerHTML=window.MASCOT({k:'leone',el:'fuoco'},'#ec2e36','stampa',1,'happy','f');
  // vignette ai bordi (left/right negativi = sbordano e vengono tagliate dalla griglia)
  var B=[
    {t:"Comando io: nessuno mi dice come vivere", cls:'L', left:-1, top:27, w:34, c:'y'},
    {t:"Super appassionata e generosa",           cls:'L', left:1,  top:46, w:33, c:'b'},
    {t:"Competitiva all'inverosimile",            cls:'L', left:-1, top:65, w:34, c:'y'},
    {t:"Non pungermi o tiro fuori le unghie",      cls:'R', right:-1,top:27, w:34, c:'b'},
    {t:"Tengo tantissimo alla mia immagine",       cls:'R', right:1, top:46, w:33, c:'y'},
    {t:"Ti faccio sentire un milione di dollari",  cls:'R', right:-1,top:65, w:34, c:'b'}
  ];
  B.forEach(function(p){
    var d=document.createElement('div');
    d.className='box '+p.cls+' '+p.c;
    d.style.top=p.top+'%'; d.style.width=p.w+'%';
    if(p.left!=null)d.style.left=p.left+'%'; if(p.right!=null)d.style.right=p.right+'%';
    d.textContent=p.t; card.appendChild(d);
  });
  var crop=document.getElementById('crop'); crop.classList.add('on');
  document.getElementById('toggle').addEventListener('click',function(){crop.classList.toggle('on');});
})();
</script>
</body>
</html>
